name: Release

# Publishes binaries for every platform when a version tag is pushed, e.g. v0.1.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - run: bun test

      - name: Build every platform
        run: bun scripts/build.ts --all

      - name: Write checksums
        run: |
          cd dist
          shasum -a 256 clue-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/clue-darwin-arm64 dist/clue-darwin-x64 \
            dist/clue-linux-arm64 dist/clue-linux-x64 \
            dist/SHA256SUMS \
            --title "clue $GITHUB_REF_NAME" --generate-notes
