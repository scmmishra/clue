name: CI

# Type checks, tests and builds clue on macOS and Linux, then installs the
# build with install.sh, the way a user would.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Check CHANGELOG.md has a section for the package.json version
        run: bun scripts/release-notes.ts > /dev/null

      - run: bun run typecheck

      - name: Run the tests
        if: runner.os != 'Linux'
        run: bun test

      # Coverage counts only code in the test process. Tests that spawn clue don't add to it.
      - name: Run the tests with coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov 2>&1 | tee test.log
          {
            echo '### Coverage'
            echo
            echo 'Code in spawned clue processes is not counted, so files that tests reach that way read low.'
            echo
            echo '```'
            grep -E '^[^|]+\|[^|]+\|[^|]+\|' test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - run: bun run build

      # A release folder with one asset and its checksum, named the way a release names them.
      - name: Install the build with install.sh
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in arm64 | aarch64) arch=arm64 ;; *) arch=x64 ;; esac
          mkdir -p "$RUNNER_TEMP/release"
          cp dist/clue "$RUNNER_TEMP/release/clue-$os-$arch"
          gzip -k "$RUNNER_TEMP/release/clue-$os-$arch"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 clue-* > SHA256SUMS)
          CLUE_LOCAL_RELEASE="$RUNNER_TEMP/release" CLUE_INSTALL_DIR="$RUNNER_TEMP/bin" bash install.sh
          test "$("$RUNNER_TEMP/bin/clue" --version)" = "$(jq -r .version package.json)"

      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh
