# How /copy <request> picks parts of the last reply: Perplexity's Decider through
# OpenRouter, or Claude Haiku without an OpenRouter key. Decider answers yes or no for
# each block. In a benchmark of 50 requests, run 3 times, Decider picked exactly the
# right blocks every time with this wording. Jev got 93% of them right.

rules:
  - The user typed /copy followed by a request. The request says which parts of the assistant's last reply to put on the clipboard.
  - People copy code far more often than prose. If a request could mean a code block or a prose block, it means the code block.
  - "The reply is split into blocks. Each block has a kind: code, paragraph or list item. label is the heading or lead-in line shown just above a block."
  - position gives the block's order among blocks of the same kind. Words like first, second and last refer to that order.
  - A request for a kind of thing, such as the sql or the shell commands, matches every block of that kind.
  - A request with a singular ordinal, such as the first query, matches one block.
  - A request can match no block at all.

# {request} and {id} are filled in for each block.
question: 'The user typed "/copy {request}". Should block {id} go on the clipboard?'

"yes": The request asks for this block, alone or as part of a group.

"no": The request does not ask for this block.
